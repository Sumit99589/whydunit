[project]
name = "whydunit"
version = "0.1.0"
description = "A team of AI detectives that finds out why a metric changed, proves it, fixes it, and confirms the fix worked."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",
    "duckdb>=1.1",
    "polars>=1.8",
    "numpy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "playwright>=1.47",
    "tavily-python>=0.5",
    "stripe>=10.0",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pytz>=2026.5",
]

[project.scripts]
whydunit = "engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "vcrpy>=6.0",
    "respx>=0.21",
    "ruff>=0.6",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs real credentials and network (skipped unless WHYDUNIT_LIVE=1)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Header", "fastapi.Depends", "fastapi.Body", "fastapi.File", "fastapi.Form"]
