name: runner-image

on:
  push:
    branches: [main]
    paths: ["runner/**", "engine/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: true
          tags: |
            ghcr.io/sumit99589/whydunit-runner:latest
            ghcr.io/sumit99589/whydunit-runner:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - name: Smoke-test the image (WebKit + Chromium flow against a local page)
        run: |
          docker run --rm --entrypoint python ghcr.io/sumit99589/whydunit-runner:${{ github.sha }} -c "
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  for k in ('chromium', 'webkit', 'firefox'):
                      b = await getattr(p, k).launch(); pg = await b.new_page()
                      await pg.set_content('<p>ok</p>'); print(k, await pg.text_content('p')); await b.close()
          asyncio.run(main())"
