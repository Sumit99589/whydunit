name: simulator

# The live world simulator (PLAN Stage 3). It advances the Acme world from the last tick to now, touching real
# systems. GitHub's cron barely fires on this repo (DECISIONS D79), so each run loops: a tick every 15 minutes
# for about 5.5 hours, then it dispatches its successor. The cron only restarts the chain if it ever breaks.
# It stays idle until its secrets are configured (BLOCKERS.md).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      skip_browsers:
        description: "Skip Playwright probes and sessions"
        type: boolean
        default: false
      loop_minutes:
        description: "Keep ticking for this long (0 = a single tick, no successor)"
        type: number
        default: 330

concurrency:
  group: simulator
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WHYDUNIT_ENGINE_URL: ${{ secrets.WHYDUNIT_ENGINE_URL }}
      WHYDUNIT_INGEST_KEY: ${{ secrets.WHYDUNIT_INGEST_KEY }}
      WHYDUNIT_ADMIN_KEY: ${{ secrets.WHYDUNIT_ADMIN_KEY }}
      ACME_URL: ${{ secrets.ACME_URL }}
      ACME_REPO: ${{ vars.ACME_REPO || 'Sumit99589/acme-demo' }}
      ACME_GITHUB_TOKEN: ${{ secrets.ACME_GITHUB_TOKEN }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$WHYDUNIT_INGEST_KEY" ] || [ -z "$ACME_URL" ]; then
            echo "::notice::Simulator not configured yet (needs DATABASE_URL, WHYDUNIT_INGEST_KEY, ACME_URL secrets). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.cfg.outputs.ready == 'true'
        with:
          enable-cache: true
      - if: steps.cfg.outputs.ready == 'true'
        run: uv sync --frozen
      - name: Cache Playwright browsers
        if: steps.cfg.outputs.ready == 'true' && inputs.skip_browsers != true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('uv.lock') }}
      - name: Install browsers
        if: steps.cfg.outputs.ready == 'true' && inputs.skip_browsers != true
        run: uv run playwright install --with-deps chromium webkit firefox
      - name: Migrate
        if: steps.cfg.outputs.ready == 'true'
        run: uv run whydunit db upgrade
      - name: Tick every 15 minutes
        if: steps.cfg.outputs.ready == 'true'
        env:
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && 330 || inputs.loop_minutes }}
          TICK_ARGS: ${{ inputs.skip_browsers == true && '--skip-browsers' || '' }}
        run: |
          git config user.name "whydunit-simulator"
          git config user.email "whydunit-simulator@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          failed=0
          while :; do
            uv run python -m simulator.tick $TICK_ARGS || { failed=$((failed + 1)); echo "::warning::tick failed"; }
            # Record ground truth when it changes.
            if [ -n "$(git status --porcelain simulator/ground_truth.json)" ]; then
              git add simulator/ground_truth.json
              git commit -q -m "chore(sim): update ground truth"
              git pull --rebase -q && git push -q || echo "::warning::ground truth push failed"
            fi
            next=$(( ($(date +%s) / 900 + 1) * 900 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) ))
          done
          echo "failed ticks: $failed"
          [ "$failed" -eq 0 ]
      - name: Dispatch the next run
        if: always() && !cancelled() && steps.cfg.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.loop_minutes > 0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run simulator.yml -R "$GITHUB_REPOSITORY" -f skip_browsers=${{ inputs.skip_browsers == true }}
