name: engine-image

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "engine/**", "simulator/**", "config/**", "migrations/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sumit99589/whydunit-engine:latest
            ghcr.io/sumit99589/whydunit-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name engine -p 8000:8000 -e DATABASE_URL=postgresql://postgres:pw@localhost:5432/postgres \
            ghcr.io/sumit99589/whydunit-engine:${{ github.sha }} \
            sh -c "uv run --no-sync python -c 'import engine.api.app, simulator.tick; print(\"import ok\")'"
          sleep 8; docker logs engine
          docker logs engine | grep -q "import ok"
